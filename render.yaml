services:
  - type: web
    name: carbonwise
    env: node
    region: oregon
    plan: free
    buildCommand: |
      npm install
      npm run build
    startCommand: |
      npx prisma generate
      npx prisma db push
      npx tsx prisma/seed.ts
      next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://your-app-name.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: carbonwise-db
          property: connectionString

 databases:
  - name: carbonwise-db
    databaseName: carbonwise
    user: carbonwise
    plan: free
